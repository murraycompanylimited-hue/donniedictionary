<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donnie Dictionary</title>
  <meta name="description" content="Donnie Dictionary — language, power, and meaning decoded daily." />
  <style>
    :root {
      --bg: #020617;
      --card: #020617;
      --accent: #f59e0b;
      --accent-soft: rgba(245,158,11,0.12);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .wrap {
      max-width: 960px;
      width: 100%;
      padding: 2rem 1.25rem 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      font-size: .7rem;
      letter-spacing: .08em;
      padding: .25rem .7rem;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      border: 1px solid rgba(245,158,11,.4);
      text-transform: uppercase;
      margin-bottom: .6rem;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0.4rem 0 0.3rem;
      letter-spacing: .02em;
    }

    h1 span {
      color: var(--accent);
    }

    header p {
      font-size: .95rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: .5rem auto 0;
    }

    .card {
      background: #020617;
      border-radius: 1rem;
      padding: 1.3rem 1.4rem;
      border: 1px solid var(--border);
      box-shadow: 0 18px 45px rgba(0,0,0,.55);
      margin-bottom: 1.2rem;
    }

    .card h2 {
      margin: 0 0 .5rem;
      font-size: 1.15rem;
    }

    .word {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .03em;
    }

    .definition {
      margin-top: .6rem;
      font-size: .95rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .etymology {
      margin-top: .6rem;
      font-size: .85rem;
      color: var(--text-muted);
      border-left: 3px solid var(--accent);
      padding-left: .6rem;
    }

    .meta {
      margin-top: .8rem;
      font-size: .75rem;
      color: #6b7280;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .7rem;
      margin-top: 1rem;
    }

    .btn {
      padding: .65rem 1.4rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: .85rem;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text-main);
      transition: transform .1s ease, box-shadow .1s ease;
    }

    .btn.primary {
      background: var(--accent);
      color: #111827;
      border: none;
      box-shadow: 0 10px 28px rgba(245,158,11,.4);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 36px rgba(0,0,0,.5);
    }

    .footer {
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      text-align: center;
      font-size: .75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

<div class="wrap">
